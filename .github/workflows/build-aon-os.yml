name: Build AON OS APK

on:
  push:
    paths:
      - 'aon-os-ui/**'
      - '.github/workflows/build-aon-os.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aon-os-ui/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Copy UI into Android assets
        run: mkdir -p app/src/main/assets && cp ../index.html app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AON-OS-debug-apk
          path: aon-os-ui/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
