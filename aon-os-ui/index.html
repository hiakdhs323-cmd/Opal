<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>AON OS</title>
<style>
:root{--bg:#0b0d12;--fg:#f8f9fc;--muted:#a8adba;--glass:rgba(25,28,37,.66);--stroke:rgba(255,255,255,.15);--shadow:0 18px 55px rgba(0,0,0,.32)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--fg)}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}
#os{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;background:radial-gradient(75% 45% at 75% 15%,#526b9e 0%,transparent 62%),radial-gradient(70% 55% at 15% 90%,#593f70 0%,transparent 65%),linear-gradient(145deg,#111826,#20283a 48%,#17131f);isolation:isolate}
#os:before{content:"";position:absolute;inset:-15%;background:radial-gradient(circle at 30% 30%,#fff2,transparent 25%),radial-gradient(circle at 75% 75%,#9ab7ff20,transparent 28%);filter:blur(25px);pointer-events:none}.screen{position:absolute;inset:0;transition:opacity .28s,transform .28s}.hidden{display:none!important}.status{position:absolute;z-index:100;top:0;left:0;right:0;height:42px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;pointer-events:none;text-shadow:0 1px 8px #0008}.status-icons{display:flex;gap:9px;align-items:center;font-size:13px}.status-icons .battery{padding:3px 7px;border-radius:9px;background:#fff;color:#111;text-shadow:none}.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(25px) saturate(1.25);-webkit-backdrop-filter:blur(25px) saturate(1.25);box-shadow:var(--shadow)}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:82px 20px 26px;text-align:center}.lock-date{font-size:18px;font-weight:650;opacity:.94}.lock-time{font-size:clamp(76px,23vw,105px);font-weight:250;letter-spacing:-5px;line-height:.95;margin:8px 0 24px}.weather-card{width:min(270px,82vw);padding:14px 17px;border-radius:24px;display:flex;align-items:center;gap:12px;text-align:left}.weather-icon{font-size:28px}.weather-card b,.weather-card small{display:block}.weather-card small{margin-top:3px;color:#d9dce4}.lock-bottom{width:100%}.notice{width:max-content;max-width:90%;margin:0 auto 16px;padding:11px 16px;border-radius:17px;font-size:13px}.actions{display:flex;justify-content:space-between;align-items:center}.action{width:54px;height:54px;border-radius:50%;background:#ffffff1b;border:1px solid #fff2;color:#fff;font-size:23px}.unlock{background:transparent;font-size:28px}
#home{padding:53px 16px 92px}.home-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:17px;font-size:13px}.widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.widget{min-height:105px;border-radius:22px;padding:15px}.widget.big{grid-column:1/-1;min-height:125px}.label{font-size:11px;color:var(--muted)}.title{font-size:19px;font-weight:750;margin-top:8px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.temp{font-size:31px;font-weight:750;margin-top:5px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:17px 7px;margin-top:19px}.app{background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;min-width:0}.icon{width:57px;height:57px;border-radius:17px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#56698f,#20283a);box-shadow:0 9px 18px #0004;border:1px solid #ffffff20}.msg{background:linear-gradient(145deg,#43e894,#0caa55)}.photo{background:linear-gradient(145deg,#ffcf78,#ef6587,#746fe4)}.weather{background:linear-gradient(145deg,#72caff,#547ce7)}.settings{background:linear-gradient(145deg,#777d89,#252831)}.notes{background:linear-gradient(145deg,#ffe68b,#f39c36)}.music{background:linear-gradient(145deg,#ff7898,#8067ed)}.files{background:linear-gradient(145deg,#62c4ff,#2774d4)}.browser{background:linear-gradient(145deg,#d0ecff,#6797f4)}.dock{position:absolute;left:15px;right:15px;bottom:24px;height:68px;border-radius:24px;display:flex;justify-content:space-around;align-items:center}.dock button{width:52px;height:52px;border-radius:16px;background:#ffffff18;border:1px solid #fff2;font-size:23px}
#app{padding-top:51px;background:linear-gradient(145deg,#11151e,#1d2432)}.appbar{height:60px;margin:0 12px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 5px}.appbar h2{font-size:18px;margin:0}.appbar button{width:44px;height:44px;background:transparent;font-size:29px}.appbody{padding:16px}.appcard{min-height:230px;border-radius:24px;padding:23px}.appcard .bigtext{font-size:27px;font-weight:750;margin-top:13px}
.panel{position:absolute;z-index:80;inset:0;background:#0006;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}.sheet{position:absolute;left:8px;right:8px;top:8px;border-radius:30px;padding:12px 15px 24px;background:rgba(27,30,39,.82)}.grabber{width:42px;height:5px;border-radius:10px;background:#fff4;margin:2px auto 13px}.panel-head{display:flex;align-items:center;justify-content:space-between}.panel-head b,.panel-head small{display:block}.panel-head small{color:var(--muted);margin-top:2px}.close{width:34px;height:34px;border-radius:50%;background:#ffffff12;font-size:20px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.toggle{min-height:72px;border-radius:20px;padding:12px;background:#ffffff0b;text-align:left;font-size:20px}.toggle.active{background:#fff;color:#111}.toggle small{display:block;font-size:11px;margin-top:5px;color:var(--muted)}.toggle.active small{color:#555}.slider{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:17px;background:#ffffff0a;margin:8px 0}.slider input{width:100%;accent-color:#fff}.media{margin-top:10px;padding:14px;border-radius:19px;display:flex;justify-content:space-between;align-items:center}.media small,.media b{display:block}.media small{color:var(--muted);font-size:10px}.media b{font-size:12px;margin-top:3px}.settings-list{display:grid;gap:9px;padding:14px 0}.row{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:18px}.switch{width:48px;height:29px;border-radius:20px;background:#555;position:relative}.switch:after{content:"";position:absolute;width:23px;height:23px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#fff}.switch.on:after{left:22px;background:#111}.toast{position:absolute;z-index:120;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 15px;border-radius:14px;background:#111d;border:1px solid #fff2;font-size:12px;white-space:nowrap;backdrop-filter:blur(15px)}.home-indicator{position:absolute;z-index:110;bottom:8px;left:50%;transform:translateX(-50%);width:118px;height:5px;border-radius:9px;background:#fff9}
@media(max-width:370px){.icon{width:52px;height:52px}.apps{gap:13px 4px}.widget{padding:12px}.title{font-size:17px}}@media(min-width:700px){#os{width:430px;height:min(900px,96dvh);border-radius:42px;box-shadow:0 30px 90px #0008}.status{border-radius:42px}}
</style>
</head>
<body>
<main id="os">
<div class="status"><span id="statusTime">9:41</span><div class="status-icons"><span>⌁</span><span>◔</span><span>▮▮</span><span class="battery">99</span></div></div>
<section id="lock" class="screen"><div><div class="lock-date" id="lockDate">일요일, 9월 6일</div><div class="lock-time" id="lockTime">9:41</div><div class="weather-card glass"><div class="weather-icon">☀</div><div><b>맑음</b><small>서울 · 24°</small></div></div></div><div class="lock-bottom"><div class="notice glass">알림이 없습니다</div><div class="actions"><button class="action" data-toast="카메라 UI는 준비 중입니다.">◉</button><button class="action unlock" id="unlock">⌄</button><button class="action" data-toast="손전등 UI는 준비 중입니다.">◌</button></div></div><div class="home-indicator"></div></section>
<section id="home" class="screen hidden"><div class="home-head glass"><span id="homeDate">9월 6일</span><span>99%</span></div><div class="widgets"><div class="widget big glass"><div class="label">오늘</div><div class="title">좋은 오후예요.</div><div class="sub">새로운 소식을 한눈에 확인하세요.</div></div><div class="widget glass"><div class="label">날씨</div><div class="temp">24°</div><div class="sub">맑음</div></div><div class="widget glass"><div class="label">일정</div><div class="title">할 일 없음</div><div class="sub">오늘은 여유롭게</div></div></div><div class="apps"><button class="app" data-app="messages"><span class="icon msg">✉</span><span>메시지</span></button><button class="app" data-app="photos"><span class="icon photo">◉</span><span>사진</span></button><button class="app" data-app="weather"><span class="icon weather">☀</span><span>날씨</span></button><button class="app" data-app="settings"><span class="icon settings">⚙</span><span>설정</span></button><button class="app" data-app="notes"><span class="icon notes">▤</span><span>노트</span></button><button class="app" data-app="music"><span class="icon music">♫</span><span>음악</span></button><button class="app" data-app="files"><span class="icon files">▱</span><span>파일</span></button><button class="app" data-app="browser"><span class="icon browser">◎</span><span>브라우저</span></button></div><div class="dock glass"><button data-app="phone">☎</button><button data-app="messages">✉</button><button data-app="browser">◎</button><button id="allApps">•••</button></div><div class="home-indicator"></div></section>
<section id="app" class="screen hidden"><header class="appbar glass"><button id="back">‹</button><h2 id="appTitle">앱</h2><button id="menu">•••</button></header><div id="appBody" class="appbody"></div><div class="home-indicator"></div></section>
<section id="cc" class="panel hidden"><div class="sheet glass"><div class="grabber"></div><div class="panel-head"><div><b>제어 센터</b><small id="ccTime">9:41</small></div><button class="close" id="closeCC">×</button></div><div class="quick"><button class="toggle active" data-toggle="air">✈<small>비행기 모드</small></button><button class="toggle active" data-toggle="wifi">⌁<small>Wi-Fi</small></button><button class="toggle" data-toggle="bt">ᛒ<small>Bluetooth</small></button><button class="toggle" data-toggle="dark">☾<small>다크 모드</small></button></div><div class="slider">☀<input type="range" min="10" max="100" value="80"></div><div class="slider">🔊<input type="range" min="0" max="100" value="65"></div><div class="media glass"><div><small>재생 중</small><b>아직 음악이 재생되지 않았습니다</b></div><button>▶</button></div></div></section>
<section id="nc" class="panel hidden"><div class="sheet glass"><div class="grabber"></div><div class="panel-head"><div><b>알림</b><small>새로운 소식</small></div><button class="close" id="closeNC">×</button></div><div class="appcard" style="text-align:center;margin-top:15px"><div style="font-size:35px">✓</div><div class="title">새 알림이 없습니다</div><div class="sub">모든 알림을 확인했습니다.</div></div><div class="appcard glass" style="min-height:auto;margin-top:10px;padding:16px"><b>AON OS</b><div class="sub">시스템 UI가 준비되었습니다. · 지금</div></div></div></section>
<div id="toast" class="toast hidden"></div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const screens={lock:$('#lock'),home:$('#home'),app:$('#app')};const data={messages:['메시지','최근 대화가 없습니다.','친구 및 가족과 빠르게 소통하세요.'],photos:['사진','새로운 추억','사진 보관함 UI'],weather:['날씨','24° · 맑음','서울 · 체감 24°'],notes:['노트','빠른 메모','아이디어를 기록하세요.'],music:['음악','재생할 음악이 없습니다.','라이브러리 UI'],files:['파일','내 파일','최근 항목과 클라우드 파일'],browser:['브라우저','검색','주소를 입력하거나 새 탭을 시작하세요.'],phone:['전화','즐겨찾기','최근 통화 없음']};
function show(k){Object.values(screens).forEach(x=>x.classList.add('hidden'));screens[k].classList.remove('hidden')}function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),1700)}function clock(){const d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'),t=`${h%12||12}:${m}`;$('#statusTime').textContent=t;$('#lockTime').textContent=t;$('#ccTime').textContent=t;$('#homeDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;$('#lockDate').textContent=new Intl.DateTimeFormat('ko-KR',{weekday:'long',month:'long',day:'numeric'}).format(d)}clock();setInterval(clock,1000);
$('#unlock').onclick=()=>show('home');$$('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));$('#back').onclick=()=>show('home');$('#menu').onclick=()=>toast('추가 메뉴');$('#allApps').onclick=()=>toast('앱 보관함 UI 준비 중입니다.');$$('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));
function openApp(k){const [title,main,sub]=data[k]||['앱','준비 중입니다.','AON OS'];$('#appTitle').textContent=title;if(k==='settings'){$('#appBody').innerHTML=`<div class="settings-list"><div class="row glass"><span>Wi-Fi</span><span>연결됨</span></div><div class="row glass"><span>Bluetooth</span><span class="switch on"></span></div><div class="row glass"><span>다크 모드</span><button id="darkSwitch" class="switch"></button></div><div class="row glass"><span>알림</span><span>›</span></div><div class="row glass"><span>디스플레이</span><span>›</span></div><div class="row glass"><span>보안 및 개인정보 보호</span><span>›</span></div></div>`;$('#darkSwitch').onclick=toggleDark}else $('#appBody').innerHTML=`<div class="appcard glass"><div class="label">${title}</div><div class="bigtext">${main}</div><div class="sub">${sub}</div></div>`;show('app')}
function toggleDark(){document.documentElement.classList.toggle('light');const on=document.documentElement.classList.contains('light');document.documentElement.style.setProperty('--fg',on?'#111':'#f8f9fc');document.documentElement.style.setProperty('--muted',on?'#656974':'#a8adba');document.documentElement.style.setProperty('--glass',on?'rgba(255,255,255,.68)':'rgba(25,28,37,.66)');document.documentElement.style.setProperty('--stroke',on?'rgba(0,0,0,.08)':'rgba(255,255,255,.15)');document.body.style.background=on?'#dfe3eb':'#050609';const s=$('#darkSwitch');if(s)s.classList.toggle('on',on);toast(on?'라이트 모드':'다크 모드')}
$$('.toggle').forEach(b=>b.onclick=()=>{b.classList.toggle('active');if(b.dataset.toggle==='dark'&&b.classList.contains('active'))toggleDark()});$('#closeCC').onclick=()=>$('#cc').classList.add('hidden');$('#closeNC').onclick=()=>$('#nc').classList.add('hidden');let startY=0;$('#os').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});$('#os').addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-startY;if(Math.abs(dy)<55)return;if(dy>55){$('#cc').classList.add('hidden');$('#nc').classList.remove('hidden')}else{$('#nc').classList.add('hidden');$('#cc').classList.remove('hidden')}},{passive:true});
</script>
</body>
</html>
